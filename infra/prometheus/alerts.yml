groups:
  - name: abstention
    rules:
      - alert: AbstentionRateHigh
        expr: |
          sum(rate(assistant_turns_total{decision=~"abstain|clarify"}[1h]))
            / clamp_min(sum(rate(assistant_turns_total[1h])), 1e-9) > 0.5
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "More than half of the answers in the last hour were refusals (possible retrieval / index problem)"
      - alert: AbstentionRateCollapsed
        expr: |
          sum(rate(assistant_turns_total{decision=~"abstain|clarify"}[6h]))
            / clamp_min(sum(rate(assistant_turns_total[6h])), 1e-9) < 0.02
          and sum(increase(assistant_turns_total[6h])) > 50
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "The assistant almost never refuses any more (gate or self-check may be broken)"
      - alert: TurnLatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(assistant_turn_seconds_bucket[15m]))) > 30
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "p95 answer latency above 30 s" }
      - alert: InjectionUploads
        expr: increase(injection_chunks_dropped_total[1h]) > 20
        labels: { severity: info }
        annotations: { summary: "Many uploaded passages were dropped as prompt injection in the last hour" }
      - alert: PromptInjectionAttempts
        expr: sum(increase(guardrail_events_total{rule="prompt_injection"}[1h])) > 5
        labels: { severity: warning }
        annotations: { summary: "More than 5 chat questions blocked as prompt injection in the last hour" }
      - alert: AnswersRedacted
        expr: sum(increase(guardrail_events_total{stage="output",rule="secrets_pii"}[1h])) > 3
        labels: { severity: info }
        annotations: { summary: "Answers contained personal data or secrets that had to be redacted" }
