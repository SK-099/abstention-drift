global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: abstain-api          # OpenTelemetry metrics exported in Prometheus format
    metrics_path: /metrics
    static_configs: [{ targets: ["api:8000"] }]
  - job_name: abstain-worker
    static_configs: [{ targets: ["worker:9101"] }]
  - job_name: qdrant
    metrics_path: /metrics
    static_configs: [{ targets: ["qdrant:6333"] }]
  - job_name: vllm                 # only when the vllm profile is running
    static_configs: [{ targets: ["vllm:8000"] }]
