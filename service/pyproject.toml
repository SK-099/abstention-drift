[project]
name = "abstain-service"
version = "0.2.0"
description = "Grounded Assistant: FastAPI + LangGraph service around the abstention-aware multi-turn RAG agent"
requires-python = ">=3.11,<3.13"
dependencies = [
    "abstain[agent]",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "aiosqlite>=0.20",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-openai>=0.3",
    "qdrant-client>=1.12",
    "httpx>=0.27",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "slowapi>=0.1.9",
    "pyjwt[crypto]>=2.9",
    "langfuse>=3.0",
    "langchain>=0.3",
    "sentry-sdk[fastapi,celery]>=2.10",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-prometheus>=0.48b0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "prometheus-client>=0.20",
    "pypdf>=4.0",
    "beautifulsoup4>=4.12",
    "python-docx>=1.1",
    "youtube-transcript-api>=1.0",
    "ddgs>=9.0",
    "guardrails-ai>=0.6,<0.12",
]

[project.optional-dependencies]
docling = ["docling>=2.0"]
migrate = ["faiss-cpu>=1.8"]
eval = ["ragas>=0.2", "matplotlib"]

[project.scripts]
abstain-api = "abstain_api.main:run"

[tool.uv.sources]
abstain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abstain_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../src"]
filterwarnings = ["ignore::DeprecationWarning"]
