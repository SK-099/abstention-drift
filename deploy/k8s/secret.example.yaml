# Copy to secret.yaml, fill in and `kubectl apply -n abstain -f secret.yaml` (or use External Secrets / Sealed Secrets).
apiVersion: v1
kind: Secret
metadata: { name: abstain-secrets }
type: Opaque
stringData:
  DATABASE_URL: postgresql+asyncpg://app:PASSWORD@your-db-host:5432/app?sslmode=require
  REDIS_URL: rediss://:PASSWORD@your-redis-host:6380/0
  QDRANT_URL: https://xxxx.cloud.qdrant.io:6333
  QDRANT_API_KEY: ""
  LLM_API_KEY: "none"
  AUTH_JWKS_URL: https://your-app.clerk.accounts.dev/.well-known/jwks.json
  AUTH_ISSUER: https://your-app.clerk.accounts.dev
  LANGFUSE_PUBLIC_KEY: ""
  LANGFUSE_SECRET_KEY: ""
  SENTRY_DSN: ""
  HF_TOKEN: ""
