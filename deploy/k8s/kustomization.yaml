# Kubernetes (EKS / GKE / AKS): API, worker, beat, migration job and vLLM on GPU nodes.
# External managed services: Postgres (RDS / Cloud SQL / Azure DB), Redis (ElastiCache / Memorystore),
# Qdrant Cloud, Langfuse Cloud (or self-hosted), Sentry.
#   cp secret.example.yaml secret.yaml   # fill in, never commit
#   kubectl apply -k deploy/k8s
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: abstain
resources:
  - namespace.yaml
  - configmap.yaml
  - migrate-job.yaml
  - api.yaml
  - worker.yaml
  - vllm.yaml
  - ingress.yaml
images:
  - name: abstain-api
    newName: ghcr.io/OWNER/abstain-api
    newTag: latest
