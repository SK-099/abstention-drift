apiVersion: v1
kind: ConfigMap
metadata: { name: abstain-config }
data:
  ENV: production
  VECTOR_STORE: qdrant
  CHECKPOINTER: postgres
  LLM_BASE_URL: http://vllm:8000/v1          # in-cluster vLLM (vllm.yaml); or a hosted endpoint
  LLM_MODEL: qwen2.5:3b                       # = vLLM --served-model-name
  DEVICE: cpu
  AUTH_MODE: jwks
  CORS_ORIGINS: '["https://your-app.vercel.app"]'
  RATE_LIMIT_CHAT: 20/minute
  LANGFUSE_HOST: https://cloud.langfuse.com
  CHECKER_PATH: /models/checker/best
  SELF_CHECK_FILE: /models/self_check.json
  HF_HOME: /data/hf
