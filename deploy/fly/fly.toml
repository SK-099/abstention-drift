# Fly.io: the API.   fly launch --no-deploy --copy-config -c deploy/fly/fly.toml
# Secrets:  fly secrets set DATABASE_URL=postgresql+asyncpg://... REDIS_URL=... QDRANT_URL=... QDRANT_API_KEY=... \
#           LLM_BASE_URL=https://api.groq.com/openai/v1 LLM_MODEL=... LLM_API_KEY=... AUTH_MODE=jwks AUTH_JWKS_URL=... \
#           LANGFUSE_PUBLIC_KEY=... LANGFUSE_SECRET_KEY=... LANGFUSE_HOST=https://cloud.langfuse.com SENTRY_DSN=...
# The checker checkpoint is baked into a volume (fly volumes create checkpoints) or served by TEI (TEI_CHECKER_URL).
app = "abstain-api"
primary_region = "fra"

[build]
  dockerfile = "../../service/Dockerfile"

[env]
  ENV = "production"
  VECTOR_STORE = "qdrant"
  CHECKPOINTER = "postgres"
  DEVICE = "cpu"
  CORS_ORIGINS = '["https://your-app.vercel.app"]'

[deploy]
  release_command = "alembic -c service/alembic.ini upgrade head"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40
  [[http_service.checks]]
    path = "/healthz"
    interval = "15s"
    timeout = "5s"
    grace_period = "60s"

[mounts]
  source = "checkpoints"
  destination = "/app/checkpoints"

[metrics]
  port = 8000
  path = "/metrics"

[[vm]]
  size = "shared-cpu-4x"
  memory = "4gb"
